name: Kitab OCR (Gemini)

# ব্যবহার: এই ফাইলটি রাখুন  .github/workflows/kitab-ocr.yml
# Secret: Settings → Secrets and variables → Actions → New repository secret → নাম: GEMINI_API_KEY
# রিপোর গঠন:
#   prompt.txt          (মেইন রিপোতে, প্রম্পট)
#   pages/              (কিতাবের ইমেজ: 0001.jpg, 0002.jpg ...)
#   texts/              (আউটপুট txt এখানে তৈরি হবে)
#   ocr_progress.json   (অগ্রগতি ট্র্যাক করবে)

on:
  workflow_dispatch:
    inputs:
      pages_dir:
        description: "ইমেজ ফোল্ডার"
        default: "pages"
      output_dir:
        description: "টেক্সট আউটপুট ফোল্ডার"
        default: "texts"
      prompt_file:
        description: "প্রম্পট ফাইল"
        default: "prompt.txt"
      model:
        description: "Gemini মডেল"
        default: "gemini-3.5-flash-lite"
      max_images:
        description: "এই রানে সর্বোচ্চ কয়টি ইমেজ (0 = সব)"
        default: "0"

permissions:
  contents: write   # টেক্সট ও json পুশ করার জন্য
  actions: write    # সময় শেষ হলে নিজেকে আবার চালু করার জন্য

# একসাথে দুইটা রান যেন না চলে
concurrency:
  group: kitab-ocr
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PAGES_DIR: ${{ inputs.pages_dir || 'pages' }}
      OUTPUT_DIR: ${{ inputs.output_dir || 'texts' }}
      PROMPT_FILE: ${{ inputs.prompt_file || 'prompt.txt' }}
      MODEL: ${{ inputs.model || 'gemini-3.5-flash-lite' }}
      MAX_IMAGES: ${{ inputs.max_images || '0' }}
      PROGRESS_FILE: ocr_progress.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run OCR (one image at a time, push after each)
        id: ocr
        run: |
          python3 - <<'PY'
          import os, re, sys, json, time, base64, subprocess
          from datetime import datetime, timezone
          import requests

          # ---------- কনফিগ ----------
          API_KEY       = os.environ.get("GEMINI_API_KEY", "").strip()
          PAGES_DIR     = os.environ["PAGES_DIR"]
          OUTPUT_DIR    = os.environ["OUTPUT_DIR"]
          PROMPT_FILE   = os.environ["PROMPT_FILE"]
          MODEL         = os.environ["MODEL"]
          MAX_IMAGES    = int(os.environ.get("MAX_IMAGES", "0") or 0)
          PROGRESS_FILE = os.environ["PROGRESS_FILE"]

          MAX_RETRIES   = 6          # প্রতি ইমেজে সর্বোচ্চ চেষ্টা
          TIME_BUDGET   = 5 * 3600 + 35 * 60   # ৫ঘ ৩৫মি পর নতুন ইমেজ শুরু করবে না
          START         = time.time()
          EXTS          = {".jpg": "image/jpeg", ".jpeg": "image/jpeg",
                           ".png": "image/png", ".webp": "image/webp"}

          GEMINI_URL = (f"https://generativelanguage.googleapis.com/v1beta/models/"
                        f"{MODEL}:streamGenerateContent?alt=sse&key={API_KEY}")

          def log(*a):
              print(*a, flush=True)

          def set_output(k, v):
              path = os.environ.get("GITHUB_OUTPUT")
              if path:
                  with open(path, "a") as f:
                      f.write(f"{k}={v}\n")

          def sh(*cmd, check=True):
              return subprocess.run(cmd, check=check, capture_output=True, text=True)

          def natural_key(s):
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r"(\d+)", s)]

          # ---------- প্রি-চেক ----------
          if not API_KEY:
              log("::error::GEMINI_API_KEY secret সেট করা নেই।")
              sys.exit(1)
          if not os.path.isfile(PROMPT_FILE):
              log(f"::error::{PROMPT_FILE} পাওয়া যায়নি।")
              sys.exit(1)
          if not os.path.isdir(PAGES_DIR):
              log(f"::error::{PAGES_DIR}/ ফোল্ডার পাওয়া যায়নি।")
              sys.exit(1)

          with open(PROMPT_FILE, encoding="utf-8") as f:
              PROMPT = f.read().strip()
          if not PROMPT:
              log("::error::prompt.txt খালি।")
              sys.exit(1)

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          images = sorted(
              [f for f in os.listdir(PAGES_DIR)
               if os.path.splitext(f)[1].lower() in EXTS],
              key=natural_key)
          total = len(images)
          if total == 0:
              log("কোনো ইমেজ পাওয়া যায়নি।")
              set_output("remaining", "false")
              sys.exit(0)

          # ---------- প্রগ্রেস লোড ----------
          def load_progress():
              if os.path.isfile(PROGRESS_FILE):
                  try:
                      with open(PROGRESS_FILE, encoding="utf-8") as f:
                          return json.load(f)
                  except Exception:
                      pass
              return {}

          progress = load_progress()
          completed = list(progress.get("completed", []))
          failed = dict(progress.get("failed", {}))

          def save_progress(last=None):
              done_set = set(completed)
              progress_obj = {
                  "model": MODEL,
                  "total_images": total,
                  "completed_count": len(completed),
                  "last_completed": last if last else progress.get("last_completed"),
                  "next_pending": next((i for i in images if i not in done_set), None),
                  "completed": completed,
                  "failed": failed,
                  "updated_at": datetime.now(timezone.utc).isoformat(),
              }
              progress["last_completed"] = progress_obj["last_completed"]
              with open(PROGRESS_FILE, "w", encoding="utf-8") as f:
                  json.dump(progress_obj, f, ensure_ascii=False, indent=2)

          # ---------- Gemini কল (streaming SSE) ----------
          def ocr_image(path):
              mime = EXTS[os.path.splitext(path)[1].lower()]
              with open(path, "rb") as f:
                  b64 = base64.b64encode(f.read()).decode()
              body = {
                  "contents": [{
                      "role": "user",
                      "parts": [
                          {"text": PROMPT},
                          {"inline_data": {"mime_type": mime, "data": b64}},
                      ],
                  }],
                  "generationConfig": {"temperature": 0.1},
              }
              last_err = None
              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      r = requests.post(GEMINI_URL, json=body, stream=True, timeout=(30, 300))
                      if r.status_code != 200:
                          last_err = f"HTTP {r.status_code}: {r.text[:300]}"
                          if r.status_code in (429, 500, 502, 503, 504):
                              wait = min(120, 10 * attempt * attempt)
                              log(f"   ↻ চেষ্টা {attempt}/{MAX_RETRIES} — {last_err} — {wait}s অপেক্ষা")
                              time.sleep(wait)
                              continue
                          raise RuntimeError(last_err)

                      chunks, finish = [], None
                      for raw in r.iter_lines(decode_unicode=True):
                          if not raw or not raw.startswith("data:"):
                              continue
                          data = raw[5:].strip()
                          if not data or data == "[DONE]":
                              continue
                          try:
                              j = json.loads(data)
                          except json.JSONDecodeError:
                              continue
                          for cand in j.get("candidates", []):
                              for p in cand.get("content", {}).get("parts", []):
                                  if "text" in p:
                                      chunks.append(p["text"])
                              if cand.get("finishReason"):
                                  finish = cand["finishReason"]
                          if j.get("promptFeedback", {}).get("blockReason"):
                              raise RuntimeError("Blocked: " + j["promptFeedback"]["blockReason"])

                      text = "".join(chunks).strip()
                      if not text:
                          last_err = f"খালি রেসপন্স (finishReason={finish})"
                          log(f"   ↻ চেষ্টা {attempt}/{MAX_RETRIES} — {last_err}")
                          time.sleep(5 * attempt)
                          continue
                      return text, finish
                  except (requests.RequestException, RuntimeError) as e:
                      last_err = str(e)
                      log(f"   ↻ চেষ্টা {attempt}/{MAX_RETRIES} — {last_err[:300]}")
                      time.sleep(min(60, 5 * attempt))
              raise RuntimeError(last_err or "unknown error")

          # ---------- কমিট ও পুশ ----------
          sh("git", "config", "user.name", "github-actions[bot]")
          sh("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")

          def commit_push(files, msg):
              sh("git", "add", *files)
              if sh("git", "diff", "--cached", "--quiet", check=False).returncode == 0:
                  return
              sh("git", "commit", "-m", msg)
              for i in range(1, 6):
                  sh("git", "pull", "--rebase", "--autostash", check=False)
                  res = sh("git", "push", check=False)
                  if res.returncode == 0:
                      return
                  log(f"   push ব্যর্থ ({i}/5): {res.stderr.strip()[:200]}")
                  time.sleep(3 * i)
              raise RuntimeError("git push ব্যর্থ হয়েছে")

          # ---------- মূল লুপ ----------
          done_set = set(completed)
          pending = [i for i in images if i not in done_set]
          log(f"মোট: {total} | সম্পূর্ণ: {len(done_set)} | বাকি: {len(pending)}")

          processed = 0
          stopped_for_time = False
          for name in pending:
              if MAX_IMAGES and processed >= MAX_IMAGES:
                  break
              if time.time() - START > TIME_BUDGET:
                  stopped_for_time = True
                  log("⏱ সময়সীমা প্রায় শেষ — এই রান এখানেই থামছে।")
                  break

              idx = images.index(name) + 1
              log(f"[{idx}/{total}] {name} → প্রসেসিং...")
              out_name = os.path.splitext(name)[0] + ".txt"
              out_path = os.path.join(OUTPUT_DIR, out_name)
              try:
                  text, finish = ocr_image(os.path.join(PAGES_DIR, name))
                  with open(out_path, "w", encoding="utf-8") as f:
                      f.write(text + "\n")
                  if name not in completed:
                      completed.append(name)
                  failed.pop(name, None)
                  save_progress(last=name)
                  commit_push([out_path, PROGRESS_FILE],
                              f"OCR: {name} ({len(completed)}/{total})")
                  log(f"   ✔ সম্পন্ন ও পুশ হয়েছে ({len(text)} অক্ষর, finish={finish})")
                  processed += 1
              except Exception as e:
                  log(f"   ✘ ব্যর্থ: {name} — {e}")
                  failed[name] = {"error": str(e)[:300],
                                  "at": datetime.now(timezone.utc).isoformat()}
                  save_progress()
                  try:
                      commit_push([PROGRESS_FILE], f"OCR failed: {name}")
                  except Exception as ee:
                      log(f"   progress পুশ ব্যর্থ: {ee}")
                  processed += 1
              # রেট-লিমিট এড়াতে সামান্য বিরতি
              time.sleep(2)

          # ---------- শেষ ----------
          done_set = set(completed)
          remaining = [i for i in images if i not in done_set]
          retriable = [i for i in remaining if i not in failed]
          log(f"\nএই রানে প্রসেস: {processed} | মোট সম্পূর্ণ: {len(done_set)}/{total} | ব্যর্থ: {len(failed)}")

          # সময়ের কারণে বা max_images এর কারণে থামলে এবং কাজ বাকি থাকলে আবার চালু হবে
          again = bool(stopped_for_time and retriable)
          set_output("remaining", "true" if again else "false")
          if failed:
              log("ব্যর্থ ফাইল: " + ", ".join(failed.keys()))
          PY

      - name: Re-trigger if work remains
        if: steps.ocr.outputs.remaining == 'true'
        run: gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
